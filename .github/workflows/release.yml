name: Release plugins

on:
  push:
    branches: [main]
    paths: ["Plugins/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build-manifest.py
      - name: Publish a permanent plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(build/*.clinkplugin manifest.json)
          tag=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [ "$draft" = true ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --latest
            else
              gh release edit "$tag" --latest
            fi
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "Latest plugins" --draft
            gh release edit "$tag" --draft=false --latest
          fi
